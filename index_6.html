<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Jaylah's Academy</title>
  <meta name="description" content="Jaylah's Academy — reading and math practice." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1B4D3E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Jaylah's Academy" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <style>
    html, body { margin: 0; padding: 0; background: #F4EEE0; -webkit-tap-highlight-color: transparent; }
    #root { min-height: 100vh; }
  </style>

  <!-- Storage shim: the app calls window.storage; map it to the browser's localStorage
       so all of Jaylah's progress, time, and word lists save on this device. -->
  <script>
    window.storage = {
      get: async function (key) {
        try { var v = localStorage.getItem(key); return (v === null) ? null : { value: v }; }
        catch (e) { return null; }
      },
      set: async function (key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      },
      delete: async function (key) {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- The compiled app (React is bundled inside — no internet needed to run) -->
  <script src="app.js"></script>

  <!-- Register the service worker so it works offline and installs to the home screen -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW registration failed', e); });
      });
    }
  </script>
</body>
</html>
