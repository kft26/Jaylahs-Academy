<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Word Stars — Read &amp; Spell</title>
<meta name="theme-color" content="#FF9F1C" />
<link rel="manifest" href="./manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Word Stars" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<style>
  /* ============ Design tokens ============ */
  :root{
    --ink:#2A2440;        /* deep grape text */
    --ink-soft:#6B6385;
    --bg:#FFF8EC;         /* warm cream */
    --bg2:#FFEFD6;
    --card:#FFFFFF;
    --marigold:#FF9F1C;   /* primary / energy */
    --marigold-dk:#F08700;
    --grass:#16B36B;      /* correct / mastered */
    --grass-dk:#0E9156;
    --berry:#FF5D8F;      /* accent */
    --sky:#4AA3F0;        /* review zone */
    --coral:#FF6B6B;      /* gentle retry */
    --gold:#FFC93C;       /* stars */
    --line:#EFE3CE;
    --shadow:0 10px 0 rgba(42,36,64,.12);
    --shadow-sm:0 6px 0 rgba(42,36,64,.10);
    --r:22px;
    --word-font:"Chalkboard SE","Comic Sans MS","Comic Neue",system-ui,sans-serif;
    --ui-font:"Nunito","Quicksand","Trebuchet MS",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--ui-font);
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--bg2), transparent 60%),
      var(--bg);
    overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
  .hidden{display:none !important;}

  /* ============ App shell ============ */
  #app{max-width:760px;margin:0 auto;padding:14px 16px 28px;min-height:100%;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;letter-spacing:.5px;}
  .brand .logo{font-size:26px;}
  .pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow-sm);}
  .ghost-btn{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);}
  .ghost-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,36,64,.10);}

  /* ============ Home ============ */
  .hero{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden;}
  .hero h1{margin:.1em 0 .1em;font-size:30px;font-weight:900;}
  .hero .sub{color:var(--ink-soft);font-weight:700;margin-bottom:14px;}
  .foxy{font-size:54px;line-height:1;animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}

  .ring-wrap{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 4px;flex-wrap:wrap;}
  .ring{position:relative;width:130px;height:130px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .ring-num{font-size:30px;font-weight:900;line-height:1;}
  .ring .ring-cap{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;}
  .stat-stack{display:flex;flex-direction:column;gap:10px;min-width:150px;}
  .stat{background:var(--bg2);border-radius:16px;padding:10px 14px;text-align:left;font-weight:800;}
  .stat b{font-size:22px;display:block;}
  .stat span{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;}

  .menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  .tile{border-radius:24px;padding:20px 16px;text-align:left;font-weight:900;font-size:20px;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:108px;justify-content:flex-end;position:relative;overflow:hidden;border:none;}
  .tile .ico{font-size:34px;position:absolute;top:14px;right:14px;opacity:.95;}
  .tile small{font-weight:800;font-size:13px;opacity:.92;}
  .tile:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(42,36,64,.18);}
  .tile.practice{background:linear-gradient(150deg,#FFB23E,var(--marigold-dk));}
  .tile.review{background:linear-gradient(150deg,#6CB7F4,#2E84D6);}
  .tile.games{background:linear-gradient(150deg,#FF7FAD,#E84393);}
  .tile.parent{background:linear-gradient(150deg,#8C7BE0,#5E4AC4);}
  .tile.full{grid-column:1 / -1;min-height:84px;}

  /* ============ Generic screen ============ */
  .screen{flex:1;display:flex;flex-direction:column;}
  .screen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px;}
  .screen-title{font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px;}
  .back-btn{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:900;box-shadow:var(--shadow-sm);}
  .back-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,36,64,.10);}

  /* progress strip */

  /* ============ Practice card ============ */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:8px 0 4px;}
  .prompt{font-weight:900;font-size:20px;color:var(--ink-soft);}
  .wordcard{
    background:var(--card);border:5px solid var(--line);border-radius:30px;
    padding:30px 26px;box-shadow:var(--shadow);min-width:min(86vw,440px);
    display:flex;align-items:center;justify-content:center;
  }
  .theword{font-family:var(--word-font);font-weight:700;font-size:clamp(54px,16vw,108px);line-height:1;letter-spacing:1px;color:var(--ink);}
  .wordcard.say{border-color:#FFE0B0;background:linear-gradient(180deg,#fff,#FFFBF3);}
  .wordcard.good{border-color:var(--grass);animation:pop .4s;}
  .wordcard.bad{border-color:var(--coral);animation:shake .4s;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .mic-row{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
  .mic-btn{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#FFB23E,var(--marigold-dk));color:#fff;font-size:42px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;border:none;}
  .mic-btn:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(42,36,64,.18);}
  .mic-btn.listening{animation:pulse 1.1s ease-in-out infinite;background:linear-gradient(160deg,#FF7FAD,var(--berry));}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,67,147,.45),var(--shadow)}50%{box-shadow:0 0 0 18px rgba(232,67,147,0),var(--shadow)}}
  .heard{min-height:24px;font-weight:800;color:var(--ink-soft);font-size:15px;}
  .mini-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .mini{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;box-shadow:var(--shadow-sm);}
  .mini:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,36,64,.10);}
  .mini.go{background:var(--grass);color:#fff;border-color:var(--grass-dk);}
  .big-go{background:var(--grass);color:#fff;border:none;border-radius:18px;padding:14px 26px;font-weight:900;font-size:18px;box-shadow:0 8px 0 var(--grass-dk);}
  .big-go:active{transform:translateY(5px);box-shadow:0 3px 0 var(--grass-dk);}

  /* spell slots + tiles */
  .slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:64px;}
  .slot{width:54px;height:64px;border-radius:14px;border:4px dashed #E4D6BC;background:#FFFDF8;display:flex;align-items:center;justify-content:center;font-family:var(--word-font);font-weight:700;font-size:38px;color:var(--ink);}
  .slot.filled{border-style:solid;border-color:var(--marigold);background:#FFF7E8;animation:pop .25s;}
  .slot.filled.good{border-color:var(--grass);background:#EAFBF2;}
  .slot.filled.bad{border-color:var(--coral);background:#FFECEC;color:var(--coral);animation:shake .35s;}
  .slot.apos{width:24px;border:none;background:transparent;}
  .tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .tile-l{width:60px;height:68px;border-radius:16px;background:var(--card);border:4px solid var(--line);box-shadow:var(--shadow-sm);font-family:var(--word-font);font-weight:700;font-size:38px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .tile-l:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(42,36,64,.10);}
  .tile-l.used{opacity:0;pointer-events:none;transform:scale(.4);transition:.2s;}
  .tile-l.wrong{animation:shake .35s;border-color:var(--coral);}
  .spell-tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* feedback banner */
  .banner{font-weight:900;font-size:22px;padding:10px 18px;border-radius:16px;display:inline-flex;gap:8px;align-items:center;}
  .banner.good{background:#EAFBF2;color:var(--grass-dk);}
  .banner.master{background:linear-gradient(120deg,#FFF1C2,#FFE08A);color:#9A6B00;font-size:24px;border:3px solid var(--gold);}

  /* review / speed */
  .speedtag{font-weight:900;font-size:18px;color:var(--sky);}

  /* ============ Parent dashboard ============ */
  .panel{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
  .panel h3{margin:0 0 10px;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);}
  .lists{display:flex;flex-direction:column;gap:8px;}
  .lrow{display:flex;align-items:center;gap:10px;}
  .lname{width:120px;font-weight:800;font-size:13px;flex-shrink:0;}
  .lname small{display:block;color:var(--ink-soft);font-weight:700;font-size:11px;}
  .lbar{flex:1;height:18px;border-radius:999px;background:var(--bg2);overflow:hidden;}
  .lbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grass),var(--grass-dk));}
  .lcount{width:54px;text-align:right;font-weight:800;font-size:13px;}
  .ldone{color:var(--grass-dk);}
  .week{display:flex;align-items:flex-end;gap:6px;height:88px;padding-top:6px;}
  .wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;}
  .wbar .col{width:70%;background:linear-gradient(180deg,var(--marigold),var(--marigold-dk));border-radius:8px 8px 4px 4px;min-height:4px;transition:height .4s;}
  .wbar .col.met{background:linear-gradient(180deg,var(--grass),var(--grass-dk));}
  .wbar .d{font-size:11px;font-weight:800;color:var(--ink-soft);}
  .wbar .m{font-size:10px;font-weight:800;color:var(--ink-soft);}
  .setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px solid var(--bg2);}
  .setting:last-child{border-bottom:none;}
  .setting label{font-weight:800;font-size:14px;}
  .setting input[type=text],.setting input[type=number]{font-family:inherit;font-weight:800;font-size:15px;border:3px solid var(--line);border-radius:12px;padding:8px 10px;width:110px;text-align:center;color:var(--ink);}
  .seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;}
  .seg button{padding:7px 14px;border-radius:9px;font-weight:800;font-size:13px;background:transparent;}
  .seg button.on{background:var(--card);box-shadow:var(--shadow-sm);}
  .danger{background:#FFECEC;color:#C0392B;border:3px solid #FFD2D2;border-radius:12px;padding:10px 14px;font-weight:800;}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap;}

  /* gate */
  .gate{position:fixed;inset:0;background:rgba(42,36,64,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .gate .box{background:var(--card);border-radius:24px;padding:24px;text-align:center;max-width:340px;width:100%;box-shadow:var(--shadow);}
  .gate input{font-family:inherit;font-weight:900;font-size:28px;width:140px;text-align:center;border:4px solid var(--line);border-radius:14px;padding:8px;margin:10px 0;color:var(--ink);}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:50;transition:transform .35s;max-width:90vw;text-align:center;}
  #toast.show{transform:translateX(-50%) translateY(0);}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:60;}

  @media (max-width:420px){
    .menu{grid-template-columns:1fr;}
    .tile{min-height:88px;}
    .slot{width:46px;height:56px;font-size:32px;}
    .tile-l{width:52px;height:60px;font-size:32px;}
  }
  /* ===== Kid practice header ===== */
  .kidbar{display:flex;align-items:stretch;gap:12px;margin-bottom:10px;}
  .sw{flex:1;display:flex;align-items:center;gap:12px;background:var(--card);border:4px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow-sm);min-width:0;}
  .sw-ico{font-size:30px;flex-shrink:0;}
  .sw-main{flex:1;min-width:0;}
  .sw-time{font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);}
  .sw-goal{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .sw-track{position:relative;height:14px;border-radius:999px;background:var(--bg2);margin:6px 0 2px;}
  .sw-track > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--marigold));transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .sw-track > i.done{background:linear-gradient(90deg,var(--grass),var(--grass-dk));}
  .sw-flag{position:absolute;right:-6px;top:-8px;font-size:18px;}
  .todaystars{display:flex;align-items:center;gap:3px;font-weight:900;font-size:24px;background:var(--card);border:4px solid var(--line);border-radius:18px;padding:8px 14px;box-shadow:var(--shadow-sm);flex-shrink:0;}
  .worddots{display:flex;align-items:center;justify-content:center;gap:6px;font-size:22px;margin-bottom:8px;min-height:26px;color:var(--gold);}
  .worddots .wd-label{font-family:var(--ui-font);font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-right:6px;}
  .mini.warn{background:#FFECEC;border-color:#FFD2D2;color:#C0392B;}
  .trick{display:inline-flex;align-items:center;gap:5px;background:#FFECEC;border:2px solid #FFD2D2;color:#C0392B;border-radius:999px;padding:5px 11px;font-weight:800;font-size:14px;font-family:var(--word-font);}
  .trick b{font-family:var(--ui-font);font-size:12px;}

  /* ===== Stickers ===== */
  .tile.stickers{background:linear-gradient(150deg,#FFCC4D,#F39C12);}
  .sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;}
  .sticker-grid.big-grid{grid-template-columns:repeat(auto-fill,minmax(94px,1fr));}
  .sticker{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg2);border:3px solid var(--line);border-radius:16px;padding:10px 6px;box-shadow:var(--shadow-sm);}
  .sticker:active{transform:translateY(2px);}
  .sticker.big{background:linear-gradient(160deg,#FFF6DE,#FFE9B8);border-color:var(--gold);}
  .sticker.locked{opacity:.5;filter:grayscale(.6);}
  .sticker .st-emoji{font-size:40px;line-height:1;display:inline-block;transform-origin:center bottom;}
  .sticker.big .st-emoji{font-size:48px;}
  .sticker .st-name{font-size:11px;font-weight:800;color:var(--ink-soft);text-align:center;line-height:1.1;}
  .empty-note{font-weight:700;color:var(--ink-soft);font-size:13px;text-align:center;}
  .celebrate .cele-title{font-size:24px;font-weight:900;}
  .celebrate .cele-sticker{margin:12px auto 0;}
  .celebrate .cele-sub{font-weight:700;color:var(--ink-soft);margin:10px 0 14px;line-height:1.4;}

  .anim-hop .st-emoji{animation:s-hop .6s ease;}
  .anim-wag .st-emoji{animation:s-wag .6s ease;}
  .anim-wave .st-emoji{animation:s-wave .7s ease;}
  .anim-wiggle .st-emoji{animation:s-wiggle .6s ease;}
  .anim-pop .st-emoji{animation:s-pop .5s ease;}
  .anim-spin .st-emoji{animation:s-spin .7s ease;}
  .anim-float .st-emoji{animation:s-float .9s ease;}
  .anim-dance .st-emoji{animation:s-dance .8s ease;}
  .anim-nod .st-emoji{animation:s-nod .6s ease;}
  @keyframes s-hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}50%{transform:translateY(0)}70%{transform:translateY(-9px)}}
  @keyframes s-wag{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
  @keyframes s-wave{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(16deg)}80%{transform:rotate(-8deg)}}
  @keyframes s-wiggle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-9deg)}75%{transform:translateX(7px) rotate(9deg)}}
  @keyframes s-pop{0%{transform:scale(1)}40%{transform:scale(1.4)}70%{transform:scale(.9)}100%{transform:scale(1)}}
  @keyframes s-spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  @keyframes s-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  @keyframes s-dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-12deg)}50%{transform:translateY(0)}75%{transform:translateY(-8px) rotate(12deg)}}
  @keyframes s-nod{0%,100%{transform:translateY(0)}30%{transform:translateY(4px)}60%{transform:translateY(-3px)}}

  /* ===== Games ===== */
  .theword .blank{color:var(--berry);border-bottom:6px solid var(--berry);padding:0 .08em;}
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:0 auto;}
  .mem-card{height:84px;border-radius:16px;border:4px solid #fff;background:linear-gradient(150deg,#8C7BE0,#5E4AC4);color:#fff;box-shadow:var(--shadow-sm);font-family:var(--word-font);font-weight:700;font-size:clamp(13px,4vw,20px);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;word-break:break-word;line-height:1.05;}
  .mem-card .mem-front{font-size:34px;}
  .mem-card .mem-back{display:none;}
  .mem-card.flip,.mem-card.matched{background:var(--card);color:var(--ink);border-color:var(--line);}
  .mem-card.flip .mem-front,.mem-card.matched .mem-front{display:none;}
  .mem-card.flip .mem-back,.mem-card.matched .mem-back{display:inline;}
  .mem-card.matched{border-color:var(--grass);background:#EAFBF2;}
  .mem-card:active{transform:translateY(2px);}

  /* ===== Editor ===== */
  .ed-lists{display:flex;flex-wrap:wrap;gap:8px;}
  .ed-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:3px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px;color:var(--ink);}
  .ed-chip.on{background:var(--card);border-color:var(--marigold);box-shadow:var(--shadow-sm);}
  .ed-chip span{font-size:11px;background:var(--marigold);color:#fff;border-radius:999px;padding:1px 7px;}
  .ed-chip.add{background:var(--grass);color:#fff;border-color:var(--grass-dk);}
  .ed-words{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .ed-row{display:flex;gap:8px;align-items:center;}
  .ed-row input{flex:1;font-family:var(--word-font);font-weight:700;font-size:20px;border:3px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink);min-width:0;}
  .ed-del{background:#FFECEC;border:3px solid #FFD2D2;border-radius:12px;padding:8px 12px;font-size:16px;flex-shrink:0;}
  .ed-add{display:flex;gap:8px;}
  .ed-add input{flex:1;font-family:var(--word-font);font-weight:700;font-size:18px;border:3px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink);min-width:0;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div id="app"><!-- views injected here --></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>

<script>
"use strict";
/* ======================================================================

let WORDS = [];   // [{id, word, list, pos}]
let TOTAL = 0;
function seedCatalogIfNeeded(){
  if(DB.catalog && DB.catalog.length) return;
  DB.catalog=[]; let id=1;
  RAW_LISTS.forEach((arr,li)=>arr.forEach(t=>DB.catalog.push({id:id++, text:t, list:li+1})));
  DB.nextId=id; save(true);
}
function rebuildWords(){
  WORDS=DB.catalog.map(c=>({id:c.id, word:c.text, list:c.list, pos:0}));
  const cnt={};
  WORDS.forEach(w=>{ cnt[w.list]=(cnt[w.list]||0)+1; w.pos=cnt[w.list]; });
  TOTAL=WORDS.length;
}
function allLists(){ return [...new Set(WORDS.map(w=>w.list))].sort((a,b)=>a-b); }
function listLabel(n){
  const items=WORDS.filter(w=>w.list===n).sort((a,b)=>a.pos-b.pos);
  return items.length ? `${items[0].word}…${items[items.length-1].word}` : `List ${n}`;
}

/* ---------- 5. Speech (listen) + Talk (speak) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICE_SUPPORTED = !!SR;
let recog=null, recogActive=false;
function setupRecog(){
  if(!VOICE_SUPPORTED) return null;
  const r=new SR();
  r.lang="en-US"; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  return r;
}
// Pick the most natural-sounding English voice the device offers (avoids the
// flat "robot" default). Premium/Siri/Google/Natural voices are preferred.
let chosenVoice=null;
function pickVoice(){
  if(!window.speechSynthesis) return null;
  const voices=speechSynthesis.getVoices()||[];
  if(!voices.length) return null;
  const en=voices.filter(v=>/^en(-|_|$)/i.test(v.lang));
  const pool=en.length?en:voices;
  const score=(v)=>{
    const n=(v.name||"").toLowerCase();
    let s=0;
    if(/(natural|neural|premium|enhanced|siri)/.test(n)) s+=60;
    if(/(google)/.test(n)) s+=45;                       // Google voices on Chrome/Android
    if(/(samantha|ava|allison|susan|zoe|jenny|aria|nicky|karen|moira|serena|tessa)/.test(n)) s+=40;
    if(/(daniel|alex|tom|guy|fred)/.test(n)) s+=20;
    if(/female/.test(n)) s+=8;
    if(v.localService===false) s+=10;                   // cloud voices tend to be richer
    if(/en-us/i.test(v.lang)) s+=12; else if(/en-gb/i.test(v.lang)) s+=6;
    if(/(compact|eloquence|albert|zarvox|robot|bad|cellos|bells|trinoids|whisper)/.test(n)) s-=50;
    return s;
  };
  pool.sort((a,b)=>score(b)-score(a));
  return pool[0]||null;
}
function ensureVoice(){ if(!chosenVoice) chosenVoice=pickVoice(); }
if(window.speechSynthesis){
  ensureVoice();
  speechSynthesis.onvoiceschanged=()=>{ chosenVoice=pickVoice(); };
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    ensureVoice();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=.92; u.pitch=1.0; u.volume=1; u.lang=(chosenVoice&&chosenVoice.lang)||"en-US";
    if(chosenVoice) u.voice=chosenVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z']/g,"").replace(/'/g,""); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return dp[m][n];
}
function saidIt(target, heard){
  const t=norm(target);
  const words=norm(heard).match(/[a-z]+/g) || [norm(heard)];
  const cands=new Set([norm(heard), ...words]);
  for(const c of cands){
    if(!c) continue;
    if(c===t) return true;
    const homo=HOMOPHONES[target.toLowerCase()]||[];
    if(homo.map(norm).includes(c)) return true;
    if(t.length>=4 && lev(c,t)<=1) return true;
    if(t.length<=2 && c.length<=3 && c.includes(t)) return true;
  }
  return false;
}

/* ---------- 6. Tiny win sounds (WebAudio) ---------- */
let actx=null;
function beep(freqs, dur){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t0=actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(actx.destination);
      const s=t0+i*0.09;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sndGood=()=>beep([660,880],0.18);

/* ---------- 7. Confetti ---------- */
const cc=document.getElementById("confetti");
const cx=cc.getContext("2d");
let parts=[];
function sizeCanvas(){ cc.width=innerWidth; cc.height=innerHeight; }
sizeCanvas(); addEventListener("resize",sizeCanvas);
function confetti(big){
  const colors=["#FF9F1C","#FF5D8F","#16B36B","#4AA3F0","#FFC93C","#8C7BE0"];
  const n=big?160:90;
  for(let i=0;i<n;i++){
    parts.push({x:innerWidth/2+(Math.random()-0.5)*120, y:innerHeight*0.4,
      vx:(Math.random()-0.5)*9, vy:-Math.random()*13-5, g:0.32,
      s:6+Math.random()*8, c:colors[i%colors.length], rot:Math.random()*6, vr:(Math.random()-0.5)*0.4, life:90+Math.random()*40});
  }
  if(!confettiRunning) runConfetti();
}
let confettiRunning=false;
function runConfetti(){
  confettiRunning=true;
  (function frame(){
    cx.clearRect(0,0,cc.width,cc.height);
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--; });
    parts=parts.filter(p=>p.life>0 && p.y<cc.height+40);
    parts.forEach(p=>{
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
      cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore();
    });
    if(parts.length) requestAnimationFrame(frame);
    else { cx.clearRect(0,0,cc.width,cc.height); confettiRunning=false; }
  })();
}

/* ---------- 11. PRACTICE ENGINE ---------- */
let pQueue=[], pCurrent=null, pPrev=null, pStep="read", pTries=0, pReadWrong=0;
function buildWorkingSet(){
  // lowest-index non-mastered words, working set up to 8 for spacing
  const pool=WORDS.filter(w=>!ws(w.id).mastered).sort((a,b)=>a.id-b.id);
  return pool.slice(0,8);
}
function pickNext(){
  let set=buildWorkingSet();
  if(set.length===0) return null;
  // fewest reps first; tricky (struggled) words break ties so they resurface; not the previous word
  set.sort((a,b)=> (ws(a.id).reps-ws(b.id).reps) || (ws(b.id).struggles-ws(a.id).struggles) || (a.id-b.id));
  let choice=set.find(w=>!pPrev||w.id!==pPrev.id) || set[0];
  return choice;
}

function toggleListen(forceStart){
  if(!VOICE_SUPPORTED) return;
  const mic=document.getElementById("mic");
  const heard=document.getElementById("heard");
  if(recogActive && !forceStart){ try{recog.stop();}catch(e){} return; }

  recog.onstart=()=>{ recogActive=true; mic&&mic.classList.add("listening"); heard&&(heard.textContent="Listening… 👂"); };
  recog.onresult=(e)=>{
    let txt=""; for(const r of e.results) txt+=" "+r[0].transcript;
    let hit=false, finalNow=false;
    for(const r of e.results){
      if(r.isFinal) finalNow=true;
      for(const alt of r){ if(saidIt(pCurrent.word, alt.transcript)){ hit=true; break; } }
    }
    heard&&(heard.textContent=`I heard: "${txt.trim()}"`);
    if(hit && !settled){ settled=true; try{recog.stop();}catch(e){} readOK(); return; }
    if(finalNow) sawFinal=true;
  };
  recog.onerror=(e)=>{ if(heard){ heard.textContent=(e.error==="not-allowed")?"Mic is blocked — use the buttons, or allow mic in Chrome.":"Didn't catch that — tap mic to try again."; } };
  recog.onend=()=>{
    recogActive=false; mic&&mic.classList.remove("listening");
    // a final result came back but it didn't match -> that's a wrong try
    if(!settled && sawFinal){ readWrong(); }
  };
  try{ recog.start(); }catch(e){}
}

/* ----- spell step (build the whole word, then check) ----- */
let spellTarget="", spellTiles=[], spellLetterPos=[], spellPlaced=[], spellCheck=[], spellWrong=0, spellOnDone=null;
function setupSpell(word, onDone, distract){
  spellTarget=word; spellPlaced=[]; spellCheck=[]; spellWrong=0; spellOnDone=onDone||null;
  spellLetterPos=[]; for(let i=0;i<word.length;i++) if(word[i]!=="'") spellLetterPos.push(i);
  let pool=word.split("").filter(c=>c!=="'");
  if(distract && pool.length>=4){
    const al="abcdefghijklmnopqrstuvwxyz".split(""); const need=new Set(word.toLowerCase().split("")); let add=0;
    while(add<2){ const c=al[Math.floor(Math.random()*26)]; if(!need.has(c)){ pool.push(c); add++; } }
  }
  spellTiles=shuffle(pool);
}
function renderSpellStep(){
  pStep="spell";
  setupSpell(pCurrent.word, spellDone, true);
  const stage=document.getElementById("stage");
  stage.innerHTML=`
    <div class="prompt" id="spellprompt">✏️ Spell the whole word!
      <button class="mini" style="margin-left:6px" onclick="speak(spellTarget)">🔊 Say again</button></div>
    <div class="slots" id="slots">${slotsHTML()}</div>
    <div class="tiles" id="tiles">${tilesHTML()}</div>
    <div class="spell-tools">
      <button class="mini" onclick="undoLetter()">↩ Undo</button>
      <button class="mini" onclick="clearSpell()">✗ Clear</button>
      <button class="mini" onclick="hintWord()">💡 Hint</button>
    </div>`;
  speak(spellTarget);
}
function slotsHTML(){
  let k=0;
  return spellTarget.split("").map((ch)=>{
    if(ch==="'") return `<div class="slot apos">'</div>`;
    const idx=k++;
    const placed = idx<spellPlaced.length ? spellPlaced[idx].c : "";
    const cs = spellCheck[idx];
    const cls = placed ? ("filled"+(cs==="good"?" good":cs==="bad"?" bad":"")) : "";
    return `<div class="slot ${cls}">${placed?escapeHtml(placed):""}</div>`;
  }).join("");
}
function tilesHTML(){
  return spellTiles.map((ch,i)=>`<button class="tile-l" data-t="${i}" onclick="tapTile(${i},this)">${ch==="'"?"'":escapeHtml(ch)}</button>`).join("");
}
function tapTile(i,el){
  if(el.classList.contains("used")) return;
  if(spellPlaced.length>=spellLetterPos.length) return;
  spellPlaced.push({c:spellTiles[i], t:i});
  el.classList.add("used");
  spellCheck=[];
  document.getElementById("slots").innerHTML=slotsHTML();
  if(spellPlaced.length===spellLetterPos.length) setTimeout(checkSpelling,260);
}
function undoLetter(){
  if(!spellPlaced.length) return;
  const last=spellPlaced.pop(); spellCheck=[];
  const t=document.querySelector(`.tile-l[data-t="${last.t}"]`); if(t) t.classList.remove("used");
  document.getElementById("slots").innerHTML=slotsHTML();
}
function clearSpell(){
  spellPlaced.forEach(p=>{ const t=document.querySelector(`.tile-l[data-t="${p.t}"]`); if(t) t.classList.remove("used"); });
  spellPlaced=[]; spellCheck=[];
  const s=document.getElementById("slots"); if(s) s.innerHTML=slotsHTML();
}
function checkSpelling(){
  spellCheck=spellPlaced.map((p,k)=> p.c===spellTarget[spellLetterPos[k]] ? "good" : "bad");
  document.getElementById("slots").innerHTML=slotsHTML();
  if(spellCheck.every(s=>s==="good")){ sndGood(); setTimeout(()=>{ if(spellOnDone) spellOnDone(); },300); return; }
  // wrong: error sound, then send the wrong letters back to the bank (keep the right ones)
  sndTry(); spellWrong++;
  setTimeout(()=>{
    const kept=[];
    spellPlaced.forEach((p,k)=>{
      if(spellCheck[k]==="good") kept.push(p);
      else { const t=document.querySelector(`.tile-l[data-t="${p.t}"]`); if(t) t.classList.remove("used"); }
    });
    spellPlaced=kept; spellCheck=[];
    const s=document.getElementById("slots"); if(s) s.innerHTML=slotsHTML();
    const prompt=document.getElementById("spellprompt");
    if(prompt) prompt.innerHTML = (spellWrong>=2?"Listen and fix the red ones ✏️":"Almost! Fix the red letters ✏️")+` <button class="mini" onclick="speak(spellTarget)">🔊</button>`;
    if(spellWrong>=2) speak(spellTarget);
  },900);
}
function hintWord(){ toast("✏️  "+spellTarget); speak(spellTarget); }
function spellDone(){ wordComplete(); }

function rToggle(forceStart){
  if(!VOICE_SUPPORTED) return;
  const mic=document.getElementById("mic"),heard=document.getElementById("heard");
  if(recogActive && !forceStart){ try{recog.stop();}catch(e){} return; }

  recog.onresult=(e)=>{

    for(const r of e.results){ if(r.isFinal) finalNow=true; for(const a of r){ if(saidIt(rCurrent.word,a.transcript)) hit=true; } }
    if(hit && !rSettled){ rSettled=true; try{recog.stop();}catch(e){} rRight(); return; }

  };
  recog.onerror=()=>{};

function rRight(){

/* ---- Missing Letter ---- */
let mlScore=0, mlRound=0, mlWord=null, mlPos=0, mlAnswer="";
function startMissing(){ mlScore=0; mlRound=0; missNext(); }
function missNext(){
  mlRound++;
  if(mlRound>10){ missEnd(); return; }
  const big=gamePool().filter(w=>w.word.replace(/[^a-zA-Z]/g,"").length>=3 && !w.word.includes("'"));
  const pool=big.length?big:gamePool();
  mlWord=pool[Math.floor(Math.random()*pool.length)];
  const letters=mlWord.word.split("");
  const idxs=letters.map((c,i)=>i).filter(i=>/[a-zA-Z]/.test(letters[i]));
  mlPos=idxs[Math.floor(Math.random()*idxs.length)];
  mlAnswer=letters[mlPos].toLowerCase();
  const shown=letters.map((c,i)=> i===mlPos?`<span class="blank">_</span>`:escapeHtml(c)).join("");
  let opts=new Set([mlAnswer]); const al="abcdefghijklmnopqrstuvwxyz";
  while(opts.size<4){ opts.add(al[Math.floor(Math.random()*26)]); }
  const optArr=shuffle([...opts]);
  app.innerHTML=`<div class="screen-head"><button class="back-btn" onclick="showView('games')">‹ Games</button>
    <div class="screen-title">🧩 Missing Letter</div><div class="pill">${mlScore} ⭐</div></div>
    <div class="screen stage">
      <div class="prompt">Round ${mlRound}/10 — what letter is missing?
        <button class="mini" onclick="speak(mlWord.word)">🔊 Hear</button></div>
      <div class="wordcard"><span class="theword">${shown}</span></div>
      <div class="tiles">${optArr.map(c=>`<button class="tile-l" onclick="missPick('${c}',this)">${c}</button>`).join("")}</div>
    </div>`;
  setTimeout(()=>speak(mlWord.word),300);
}
function missPick(c,el){
  if(c===mlAnswer){ mlScore++; confetti(false); sndGood(); speak(mlWord.word); setTimeout(missNext,800); }
  else{ el.classList.add("wrong"); sndTry(); setTimeout(()=>el.classList.remove("wrong"),350); }
}
function missEnd(){
  confetti(true); sndMaster();
  app.innerHTML=`<div class="screen-head"><button class="back-btn" onclick="showView('games')">‹ Games</button>
    <div class="screen-title">🧩 Missing Letter</div><div></div></div>
    <div class="screen stage"><div class="foxy">🎉</div>
    <div class="banner master">You found ${mlScore}/10 letters!</div>
    <button class="big-go" onclick="startMissing()">Play again</button></div>`;
}

/* ---- Memory Match ---- */
let memCards=[], memFlipped=[], memMatched=0, memBusy=false; const MEM_PAIRS=4;
function startMemory(){
  const short=shuffle(gamePool().filter(w=>w.word.replace(/[^a-zA-Z]/g,"").length<=6));
  const src=short.length>=MEM_PAIRS?short:shuffle(gamePool().slice());
  const words=[]; const seen=new Set();
  for(const w of src){ const lw=w.word.toLowerCase(); if(!seen.has(lw)){ seen.add(lw); words.push(w.word); } if(words.length>=MEM_PAIRS) break; }
  while(words.length<MEM_PAIRS) words.push(words[0]||"the");
  memCards=shuffle(words.concat(words).map(w=>({w, flipped:false, matched:false})));
  memFlipped=[]; memMatched=0; memBusy=false;
  renderMemory();
}
function renderMemory(){
  app.innerHTML=`<div class="screen-head"><button class="back-btn" onclick="showView('games')">‹ Games</button>
    <div class="screen-title">🃏 Memory Match</div><div class="pill">${memMatched}/${MEM_PAIRS}</div></div>
    <div class="screen">
      <div class="prompt" style="text-align:center;margin-bottom:12px">Find the matching word pairs!</div>
      <div class="mem-grid">
        ${memCards.map((c,i)=>`<button class="mem-card ${c.matched?'matched':c.flipped?'flip':''}" onclick="memTap(${i})">
          <span class="mem-front">?</span><span class="mem-back">${escapeHtml(c.w)}</span></button>`).join("")}
      </div>
    </div>`;
}
function memTap(i){
  if(memBusy) return;
  const c=memCards[i]; if(c.matched||c.flipped) return;
  c.flipped=true; speak(c.w); renderMemory(); memFlipped.push(i);
  if(memFlipped.length===2){
    memBusy=true; const [a,b]=memFlipped;
    if(memCards[a].w.toLowerCase()===memCards[b].w.toLowerCase()){
      setTimeout(()=>{ memCards[a].matched=memCards[b].matched=true; memMatched++; memFlipped=[]; memBusy=false;
        sndGood(); confetti(false); if(memMatched===MEM_PAIRS) memEnd(); else renderMemory(); },650);
    }else{
      sndTry();
      setTimeout(()=>{ memCards[a].flipped=memCards[b].flipped=false; memFlipped=[]; memBusy=false; renderMemory(); },950);
    }
  }
}
function memEnd(){
  confetti(true); sndMaster();
  app.innerHTML=`<div class="screen-head"><button class="back-btn" onclick="showView('games')">‹ Games</button>
    <div class="screen-title">🃏 Memory Match</div><div></div></div>
    <div class="screen stage"><div class="foxy">🎉</div>
    <div class="banner master">You matched them all! 🌟</div>
    <button class="big-go" onclick="startMemory()">Play again</button></div>`;
}

/* ---------- 14. PARENT GATE + DASHBOARD ---------- */
function parentGate(){
  const a=5+Math.floor(Math.random()*8), b=4+Math.floor(Math.random()*8);
  const wrap=document.createElement("div"); wrap.className="gate";
  wrap.innerHTML=`<div class="box">
    <div style="font-size:40px">🔒</div>
    <h3 style="margin:.3em 0;color:var(--ink-soft)">Grown-ups only</h3>
    <div style="font-weight:800;font-size:20px">What is ${a} + ${b}?</div>
    <input id="gateAns" type="number" inputmode="numeric" autocomplete="off"/>
    <div class="row-btns" style="justify-content:center">
      <button class="mini" onclick="this.closest('.gate').remove()">Cancel</button>
      <button class="mini go" id="gateOk">Enter</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const inp=wrap.querySelector("#gateAns"); inp.focus();
  const go=()=>{ if(+inp.value===a+b){ wrap.remove(); showView('parent'); } else { inp.value=""; inp.placeholder="try again"; } };
  wrap.querySelector("#gateOk").onclick=go;
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
}
function renderParent(){
  const goalMs=DB.settings.dailyGoalMin*60000;
  // last 7 days
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push({k, label:["Su","Mo","Tu","We","Th","Fr","Sa"][d.getDay()], ms:DB.daily[k]||0}); }
  const maxMs=Math.max(goalMs, ...days.map(d=>d.ms),1);
  const totalMastered=masteredCount();
  const listsDone=countDoneLists();

  app.innerHTML=`
    <div class="screen-head"><button class="back-btn" onclick="showView('home')">‹ Home</button>
      <div class="screen-title">👀 Progress</div><div></div></div>

    <div class="panel">
      <h3>Overview</h3>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div class="stat" style="flex:1;min-width:110px"><b>${totalMastered}/${TOTAL}</b><span>words mastered</span></div>
        <div class="stat" style="flex:1;min-width:110px"><b>${listsDone}/${allLists().length}</b><span>lists finished</span></div>
        <div class="stat" style="flex:1;min-width:110px"><b>${fmtMin(todayMs())} min</b><span>practiced today</span></div>
        <div class="stat" style="flex:1;min-width:110px"><b>${stickerCount()} 🎉</b><span>stickers earned</span></div>
      </div>
    </div>

    ${(function(){ const sw=struggleWords(); if(!sw.length) return `
      <div class="panel"><h3>Tricky words</h3>
        <div style="font-weight:700;color:var(--ink-soft);font-size:13px">No struggle words yet — when she misses a word's reading twice, it shows up here so you know what to review together.</div></div>`;
      return `<div class="panel"><h3>Tricky words to review (${sw.length})</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          ${sw.slice(0,40).map(w=>`<span class="trick" title="missed ${ws(w.id).struggles}×">${escapeHtml(w.word)} <b>${ws(w.id).struggles}×</b></span>`).join("")}
        </div>
        <div style="font-weight:700;color:var(--ink-soft);font-size:13px">These are words she missed while reading. The app automatically brings them back more often and needs an extra correct turn or two before they count as mastered.</div>
      </div>`; })()}

    <div class="panel">
      <h3>Daily practice — last 7 days</h3>
      <div class="week">
        ${days.map(d=>{ const h=Math.max(4,Math.round(d.ms/maxMs*72)); const met=d.ms>=goalMs;
          return `<div class="wbar"><div class="m">${d.ms?fmtMin(d.ms)+"m":""}</div>
            <div class="col ${met?'met':''}" style="height:${h}px"></div><div class="d">${d.label}</div></div>`; }).join("")}
      </div>
      <div style="font-weight:700;color:var(--ink-soft);font-size:13px;margin-top:8px">Goal: ${DB.settings.dailyGoalMin} min/day · green = goal met</div>
    </div>

    <div class="panel">
      <h3>Lists mastered &amp; completed</h3>
      <div class="lists">
        ${allLists().map((n)=>{ const s=listStats(n); const pct=Math.round(s.mastered/s.total*100);
          return `<div class="lrow">
            <div class="lname">List ${n} ${s.done?'<span class="ldone">✓</span>':''}<small>${escapeHtml(listLabel(n))}</small></div>
            <div class="lbar"><i style="width:${pct}%"></i></div>
            <div class="lcount ${s.done?'ldone':''}">${s.mastered}/${s.total}</div></div>`; }).join("")}
      </div>
    </div>

    <div class="panel">
      <h3>Words &amp; lists</h3>
      <div style="font-weight:700;color:var(--ink-soft);font-size:13px;margin-bottom:10px">
        Add your own words, make new lists, or edit any list. Custom words work everywhere — practice, speed zone, games, and stickers.</div>
      <button class="mini go" onclick="renderEditor()">✏️ Edit words &amp; lists</button>
    </div>

    <div class="panel">
      <h3>Settings</h3>
      <div class="setting"><label>Child's name</label>
        <input type="text" id="setName" value="${escapeAttr(DB.child)}" placeholder="name" maxlength="16"/></div>
      <div class="setting"><label>Daily practice goal</label>
        <div><input type="number" id="setGoal" value="${DB.settings.dailyGoalMin}" min="5" max="60"/> min</div></div>
      <div class="setting"><label>Correct reps to “master”</label>
        <div><input type="number" id="setReps" value="${DB.settings.repsToMaster}" min="1" max="6"/> times</div></div>
      <div class="setting"><label>Microphone reading</label>
        <div class="seg">
          <button id="vOn" class="${DB.settings.voice?'on':''}" onclick="setVoice(true)">On</button>
          <button id="vOff" class="${!DB.settings.voice?'on':''}" onclick="setVoice(false)">Off</button>
        </div></div>
      <div class="row-btns" style="margin-top:10px">
        <button class="mini go" onclick="saveSettings()">Save settings</button>
      </div>
    </div>

    <div class="panel">
      <h3>Backup &amp; reset</h3>
      <div style="font-weight:700;color:var(--ink-soft);font-size:13px;margin-bottom:10px">
        Progress is saved in this browser. Export a backup file to keep it safe or move it to another device.</div>
      <div class="row-btns">
        <button class="mini" onclick="exportData()">⬇ Export backup</button>
        <button class="mini" onclick="document.getElementById('impFile').click()">⬆ Import backup</button>
        <input type="file" id="impFile" accept="application/json" class="hidden" onchange="importData(event)"/>
      </div>
      <div class="row-btns" style="margin-top:10px">
        <button class="danger" onclick="resetAll()">Reset ALL progress</button>
      </div>
    </div>
  `;
}
function setVoice(on){ DB.settings.voice=on; document.getElementById("vOn").classList.toggle("on",on); document.getElementById("vOff").classList.toggle("on",!on); }
function saveSettings(){
  DB.child=document.getElementById("setName").value.trim();
  DB.settings.dailyGoalMin=clamp(+document.getElementById("setGoal").value||15,5,60);
  DB.settings.repsToMaster=clamp(+document.getElementById("setReps").value||3,1,6);
  save(true); toast("Saved! ✓"); renderParent();
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`word-stars-backup-${todayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result); DB=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d); save(true); toast("Backup loaded ✓"); renderParent(); }
    catch(e){ toast("Couldn't read that file"); } };
  fr.readAsText(f);
}
function resetAll(){
  if(!confirm("Erase ALL of your child's progress? This can't be undone.")) return;
  if(!confirm("Are you absolutely sure?")) return;
  DB=JSON.parse(JSON.stringify(DEFAULTS)); save(true); toast("Progress reset"); renderParent();
}

/* ---------- 15. helpers ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(n,lo,hi){ return Math.max(lo,Math.min(hi,n)); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,"&#39;"); }

/* ====================================================================
   STICKER BOOK + CELEBRATIONS
   ==================================================================== */
function playSticker(el){
  const a=el.getAttribute("data-anim")||"pop";
  el.classList.remove("anim-"+a); void el.offsetWidth; el.classList.add("anim-"+a);
  beep([720,940],0.10);
  el.addEventListener("animationend",()=>el.classList.remove("anim-"+a),{once:true});
}
function stickerHTML(st,cls){
  return `<button class="sticker ${cls||""}" data-anim="${st.a}" onclick="playSticker(this)" title="${escapeAttr(st.n)}">
    <span class="st-emoji">${st.e}</span><span class="st-name">${escapeHtml(st.n)}</span></button>`;
}
function renderStickers(){
  currentView="stickers"; stopTimer();
  const daily=DB.stickers.daily.map(r=>DAILY_STICKERS[r.id]).filter(Boolean);
  const dailyHTML = daily.length
    ? daily.map(s=>stickerHTML(s)).join("")
    : `<div class="empty-note">Finish your practice time to earn your first sticker! ⏱️</div>`;
  const listKeys=Object.keys(DB.stickers.lists).length;
  const listHTML=allLists().map((n)=>{
    const earned=DB.stickers.lists[n], s=LIST_STICKERS[(n-1)%LIST_STICKERS.length];
    return earned ? stickerHTML(s,"big")
      : `<div class="sticker big locked"><span class="st-emoji">🔒</span><span class="st-name">List ${n}</span></div>`;
  }).join("");
  app.innerHTML=`
    <div class="screen-head">
      <button class="back-btn" onclick="showView('home')">‹ Home</button>
      <div class="screen-title">🎟️ My Stickers</div>
      <div class="pill">${stickerCount()} 🎉</div>
    </div>
    <div class="panel">
      <h3>Day stickers · ${daily.length}</h3>
      <div class="sticker-grid">${dailyHTML}</div>
      <div class="empty-note" style="margin-top:10px">Earn one each day you finish your practice time. Tap a sticker to make it move!</div>
    </div>
    <div class="panel">
      <h3>List trophies · ${listKeys}/${allLists().length}</h3>
      <div class="sticker-grid big-grid">${listHTML}</div>
      <div class="empty-note" style="margin-top:10px">Win all 15 words in a list to earn a big trophy sticker!</div>
    </div>`;
  scrollTo(0,0);
}
function showStickerCelebration(title,sub,st,big){
  const wrap=document.createElement("div"); wrap.className="gate";
  wrap.innerHTML=`<div class="box celebrate">
    <div class="cele-title">${title}</div>
    <button class="sticker ${big?"big":""} cele-sticker" data-anim="${st.a}" onclick="playSticker(this)">
      <span class="st-emoji">${st.e}</span><span class="st-name">${escapeHtml(st.n)}</span></button>
    <div class="cele-sub">${sub}</div>
    <div class="row-btns" style="justify-content:center">
      <button class="big-go" onclick="this.closest('.gate').remove();goalCelebrating=false;">Yay!</button>
      <button class="mini" onclick="this.closest('.gate').remove();goalCelebrating=false;showView('stickers');">See all</button>
    </div></div>`;
  document.body.appendChild(wrap);
  const s=wrap.querySelector(".cele-sticker"); setTimeout(()=>playSticker(s),250);
}
function celebrateDailyGoal(st){
  goalCelebrating=true; confetti(true); sndMaster();
  showStickerCelebration("⏱️ Time complete!","You practiced your whole time today!<br>A new sticker for your book! 🎉",st,false);
}
function celebrateListSticker(n,st){
  confetti(true); sndMaster();
  showStickerCelebration(`🏆 List ${n} done!`,"You won every word in this list!<br>Here's a big trophy sticker! 🌟",st,true);
}

/* ====================================================================
   WORD / LIST EDITOR (grown-ups)
   ==================================================================== */
let edSel=null;
function renderEditor(){
  currentView="editor"; stopTimer();
  const lists=allLists();
  if(edSel===null || (!lists.includes(edSel) && DB.catalog.filter(c=>c.list===edSel).length===0 && lists.length)) edSel=lists[0]||1;
  const selLists = lists.includes(edSel) ? lists : [...lists, edSel];
  const words=DB.catalog.filter(c=>c.list===edSel).sort((a,b)=>a.id-b.id);
  app.innerHTML=`
    <div class="screen-head"><button class="back-btn" onclick="renderParent()">‹ Back</button>
      <div class="screen-title">✏️ Words &amp; Lists</div><div></div></div>
    <div class="panel">
      <h3>Pick a list</h3>
      <div class="ed-lists">
        ${selLists.map(n=>`<button class="ed-chip ${n===edSel?'on':''}" onclick="edPick(${n})">List ${n}<span>${DB.catalog.filter(c=>c.list===n).length}</span></button>`).join("")}
        <button class="ed-chip add" onclick="edAddList()">➕ New list</button>
      </div>
    </div>
    <div class="panel">
      <h3>List ${edSel} · ${words.length} word${words.length===1?"":"s"}</h3>
      <div class="ed-words">
        ${words.length ? words.map(w=>`<div class="ed-row">
          <input type="text" value="${escapeAttr(w.text)}" onchange="edEditWord(${w.id},this.value)" maxlength="20" autocapitalize="off"/>
          <button class="ed-del" onclick="edRemoveWord(${w.id})" title="remove">🗑</button>
        </div>`).join("") : `<div class="empty-note" style="text-align:left">This list is empty. Add the first word below!</div>`}
      </div>
      <div class="ed-add">
        <input type="text" id="edNew" placeholder="type a new word" maxlength="20" autocapitalize="off"
          onkeydown="if(event.key==='Enter')edAddWordFromInput()"/>
        <button class="mini go" onclick="edAddWordFromInput()">➕ Add</button>
      </div>
      ${allLists().length>1?`<button class="danger" style="margin-top:12px" onclick="edDeleteList(${edSel})">🗑 Delete List ${edSel}</button>`:""}
    </div>
    <div class="panel">
      <div style="font-weight:700;color:var(--ink-soft);font-size:13px">Tip: changing a word's spelling keeps its progress. Removing a word also clears its stars. New words show up everywhere — Practice, Speed Zone, and Games.</div>
    </div>`;
  scrollTo(0,0);
}
function edPick(n){ edSel=n; renderEditor(); }
function edAddList(){
  const mx=DB.catalog.reduce((m,c)=>Math.max(m,c.list),0);
  edSel=mx+1; renderEditor();
  const i=document.getElementById("edNew"); if(i) i.focus();
}
function edAddWordFromInput(){
  const i=document.getElementById("edNew"); if(!i) return;
  const t=i.value.trim(); if(!t) return;
  DB.catalog.push({ id:DB.nextId++, text:t, list:edSel });
  rebuildWords(); save(true); renderEditor();
  const n=document.getElementById("edNew"); if(n) n.focus();
}
function edEditWord(id,val){
  const v=val.trim(); if(!v) return;
  const c=DB.catalog.find(x=>x.id===id); if(!c) return;
  c.text=v; rebuildWords(); save(true);
}
function edRemoveWord(id){
  DB.catalog=DB.catalog.filter(c=>c.id!==id);
  if(DB.words[id]) delete DB.words[id];
  rebuildWords(); save(true); renderEditor();
}
function edDeleteList(n){
  if(allLists().length<=1){ toast("Keep at least one list."); return; }
  if(!confirm(`Delete List ${n} and all its words? This can't be undone.`)) return;
  const ids=DB.catalog.filter(c=>c.list===n).map(c=>c.id);
  DB.catalog=DB.catalog.filter(c=>c.list!==n);
  ids.forEach(id=>{ if(DB.words[id]) delete DB.words[id]; });
  if(DB.stickers.lists[n]) delete DB.stickers.lists[n];
  rebuildWords(); save(true);
  edSel=allLists()[0]||1; renderEditor();
}

/* ---------- go ---------- */
showView("home");
