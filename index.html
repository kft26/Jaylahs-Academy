  <link rel="manifest" href="manifest.json" />

  <script>
    // Save the child's progress to this device's storage
    window.storage = {
      get: async function (k){ try { var v = localStorage.getItem(k); return (v===null)?null:{value:v}; } catch(e){ return null; } },
      set: async function (k,v){ try { localStorage.setItem(k,v); } catch(e){} },
      delete: async function (k){ try { localStorage.removeItem(k); } catch(e){} }
    };
    // If anything fails, show it on screen instead of a blank page
    window.addEventListener('error', function (e) {
      var r = document.getElementById('root');
      if (r && !r.hasChildNodes()) {
        r.innerHTML = '<pre style="padding:18px;margin:0;color:#8a1c00;background:#FFF5F2;white-space:pre-wrap;font:13px/1.5 monospace">Something went wrong loading the app:\n\n' + ((e && e.message) ? e.message : e) + '</pre>';
      }
    });
  </script>

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Nunito:wght@400;600;700;800;900&display=swap');
        :root { --bg:#F4EEE0; --card:#FFFEF8; --primary:#1B4D3E; --green:#2A7A4B; --green-light:#68B88C; --green-dark:#163D30;
          --amber:#E8A820; --amber-dark:#B87B10; --red:#C84230; --blue:#2A5C7A; --blue-light:#4A88AE; --purple:#7A4EA8; --purple-light:#9B74C4; --rust:#C06A2C;
          --text:#1C1308; --text2:#5C4828; --border:#DDD0B4; --parchment-dark:#E8DFC8;
          --shadow:0 2px 12px rgba(28,19,8,.10); --shadow-md:0 6px 24px rgba(28,19,8,.14); --shadow-lg:0 12px 40px rgba(28,19,8,.18); }
        * { box-sizing:border-box; } body { margin:0; }
        button { cursor:pointer; border:none; transition:transform .12s, box-shadow .12s; }
        button:active { transform:scale(.95) !important; }
        button:disabled { cursor:default; }
        input, textarea { outline:none; }
        ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-track { background:var(--parchment-dark); } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
        @keyframes starBurst { 0%{transform:scale(0) rotate(-15deg);opacity:1} 60%{transform:scale(1.5) rotate(5deg);opacity:1} 100%{transform:scale(1.2);opacity:0} }
        @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 rgba(200,144,26,0)} 50%{box-shadow:0 0 28px rgba(200,144,26,.5)} }
        .fade-up{animation:fadeUp .35s ease forwards} .shake{animation:shake .35s ease} .pulse-glow{animation:pulseGlow 1.8s ease infinite}
        .lesson-card{ background:var(--card); border-radius:20px; box-shadow:var(--shadow-md); border:1.5px solid var(--border); padding:28px 24px; margin-bottom:18px; }
        .btn-primary{ background:var(--primary); color:white; border-radius:14px; padding:15px 28px; font-family:Nunito,sans-serif; font-size:17px; font-weight:800; box-shadow:0 6px 20px rgba(27,77,62,.3); width:100%; margin-bottom:10px; letter-spacing:.3px; }
        .btn-primary:hover{ box-shadow:0 8px 28px rgba(27,77,62,.4); transform:translateY(-2px); }
        .btn-secondary{ background:var(--parchment-dark); color:var(--text); border-radius:14px; padding:13px 24px; font-family:Nunito,sans-serif; font-size:16px; font-weight:700; border:1.5px solid var(--border); width:100%; margin-bottom:10px; }
        .btn-secondary:hover{ background:var(--border); }
        .btn-amber{ background:var(--amber); color:var(--text); border-radius:14px; padding:15px 28px; font-family:Nunito,sans-serif; font-size:17px; font-weight:800; box-shadow:0 6px 20px rgba(200,144,26,.4); width:100%; margin-bottom:10px; }
        .btn-amber:hover{ box-shadow:0 8px 28px rgba(200,144,26,.55); transform:translateY(-2px); }
        .word-display{ font-family:"Playfair Display",serif; font-weight:900; color:var(--primary); text-align:center; line-height:1; letter-spacing:2px; }
        .tab-btn{ padding:9px 16px; border-radius:10px; font-family:Nunito,sans-serif; font-size:14px; font-weight:700; border:1.5px solid var(--border); }
